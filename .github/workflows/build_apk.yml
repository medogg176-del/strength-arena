name: Build Strength Arena APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Build APK
        run: |
          rm -rf android
          flutter create . --project-name strength_arena --platforms=android --org com.strengtharena
          flutter pub add app_links:^6.3.2
          python3 -c '
          import glob, re

          # 1. ضبط ext في android/build.gradle
          for root_gradle in glob.glob("android/build.gradle*"):
              with open(root_gradle, "r", encoding="utf-8") as f:
                  txt = f.read()
              if not root_gradle.endswith(".kts") and "compileSdkVersion" not in txt:
                  ext_block = "ext {\n    compileSdkVersion = 34\n    minSdkVersion = 21\n    targetSdkVersion = 34\n}\n"
                  if "allprojects {" in txt:
                      txt = txt.replace("allprojects {", ext_block + "\nallprojects {", 1)
                  else:
                      txt = ext_block + "\n" + txt
                  with open(root_gradle, "w", encoding="utf-8") as f:
                      f.write(txt)

          # 2. استبدال أي إشارة لـ flutter.compileSdkVersion أو flutter.minSdkVersion في كل ملفات gradle
          for path in glob.glob("android/**/build.gradle*", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  txt = f.read()

              txt = re.sub(r"compileSdkVersion\s*=?\s*flutter\.compileSdkVersion", "compileSdkVersion 34", txt)
              txt = re.sub(r"compileSdk\s*=?\s*flutter\.compileSdkVersion", "compileSdk = 34" if path.endswith(".kts") else "compileSdkVersion 34", txt)
              txt = re.sub(r"minSdkVersion\s*=?\s*flutter\.minSdkVersion", "minSdkVersion 21", txt)
              txt = re.sub(r"minSdk\s*=?\s*flutter\.minSdkVersion", "minSdk = 21" if path.endswith(".kts") else "minSdkVersion 21", txt)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(txt)

          # 3. التحقق من أن android/app/build.gradle يحتوي على 34
          for app_gradle in glob.glob("android/app/build.gradle*"):
              with open(app_gradle, "r", encoding="utf-8") as f:
                  txt = f.read()
              if "34" not in txt and "android {" in txt:
                  line = "    compileSdk = 34\n" if app_gradle.endswith(".kts") else "    compileSdkVersion 34\n"
                  txt = txt.replace("android {\n", "android {\n" + line, 1)
                  with open(app_gradle, "w", encoding="utf-8") as f:
                      f.write(txt)
              print("Checked:", app_gradle)
          '
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: strength-arena-apk
          path: build/app/outputs/flutter-apk/app-release.apk
