name: Build Strength Arena APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Build APK
        run: |
          rm -rf android
          flutter create . --project-name strength_arena --platforms=android --org com.strengtharena
          python3 -c '
          p = "android/app/build.gradle"
          s = open(p).read()
          if "compileSdkVersion" not in s:
              s = s.replace("android {", "android {\n    compileSdkVersion 34", 1)
          open(p, "w").write(s)
          '
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: strength-arena-apk
          path: build/app/outputs/flutter-apk/app-release.apk
