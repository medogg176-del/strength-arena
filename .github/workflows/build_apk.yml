name: Build Strength Arena APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Build APK
        run: |
          rm -rf android
          flutter create . --project-name strength_arena --platforms=android --org com.strengtharena
          flutter pub add app_links
          python3 -c '
          import glob, re

          root_gradle = "android/build.gradle"
          with open(root_gradle, "r", encoding="utf-8") as f:
              root_txt = f.read()

          ext_block = """buildscript {
              ext {
                  compileSdkVersion = 34
                  minSdkVersion = 21
                  targetSdkVersion = 34
              }
          }
          """
          if "compileSdkVersion = 34" not in root_txt:
              with open(root_gradle, "w", encoding="utf-8") as f:
                  f.write(ext_block + "\n" + root_txt)

          for path in glob.glob("android/app/build.gradle*", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  txt = f.read()

              if path.endswith(".kts"):
                  txt = re.sub(r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = 34", txt)
                  txt = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 21", txt)
              else:
                  txt = re.sub(r"compileSdkVersion\s*=?\s*flutter\.compileSdkVersion", "compileSdkVersion 34", txt)
                  txt = re.sub(r"compileSdk\s*=?\s*flutter\.compileSdkVersion", "compileSdkVersion 34", txt)
                  txt = re.sub(r"minSdkVersion\s*=?\s*flutter\.minSdkVersion", "minSdkVersion 21", txt)
                  txt = re.sub(r"minSdk\s*=?\s*flutter\.minSdkVersion", "minSdkVersion 21", txt)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(txt)
          '
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: strength-arena-apk
          path: build/app/outputs/flutter-apk/app-release.apk
