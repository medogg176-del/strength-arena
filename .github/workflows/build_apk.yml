name: Build Strength Arena APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Build APK
        run: |
          rm -rf android
          flutter create . --project-name strength_arena --platforms=android --org com.strengtharena
          python3 -c '
          from pathlib import Path

          # ضبط android/build.gradle
          root_gradle = Path("android/build.gradle")
          if root_gradle.exists():
              text = root_gradle.read_text(encoding="utf-8")
              ext_snippet = """buildscript {
                  ext {
                      compileSdkVersion = 34
                      minSdkVersion = 21
                      targetSdkVersion = 34
                  }
              }
              """
              if "compileSdkVersion = 34" not in text:
                  root_gradle.write_text(ext_snippet + "\n" + text, encoding="utf-8")

          # ضبط android/app/build.gradle
          app_gradle = Path("android/app/build.gradle")
          if app_gradle.exists():
              text = app_gradle.read_text(encoding="utf-8")
              text = text.replace("compileSdk flutter.compileSdkVersion", "compileSdk 34")
              text = text.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 34")
              text = text.replace("minSdk flutter.minSdkVersion", "minSdk 21")
              text = text.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
              text = text.replace("targetSdk flutter.targetSdkVersion", "targetSdk 34")
              text = text.replace("targetSdkVersion flutter.targetSdkVersion", "targetSdkVersion 34")
              if "compileSdkVersion 34" not in text and "compileSdk 34" not in text:
                  text = text.replace("android {", "android {\n    compileSdkVersion 34", 1)
              app_gradle.write_text(text, encoding="utf-8")
              print("--- android/app/build.gradle ---")
              print(text)
          '
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: strength-arena-apk
          path: build/app/outputs/flutter-apk/app-release.apk
