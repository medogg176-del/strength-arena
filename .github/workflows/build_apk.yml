name: Build Strength Arena APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Build APK
        run: |
          rm -rf android
          flutter create . --project-name strength_arena --platforms=android --org com.strengtharena
          python3 -c '
          from pathlib import Path
          import glob, re

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if wrapper.exists():
              wtxt = wrapper.read_text(encoding="utf-8")
              wtxt = re.sub(r"gradle-[0-9.]+-(all|bin)\.zip", "gradle-8.4-bin.zip", wtxt)
              wrapper.write_text(wtxt, encoding="utf-8")

          root_gradle = Path("android/build.gradle")
          if root_gradle.exists():
              txt = root_gradle.read_text(encoding="utf-8")
              ext_block = "ext {\n    compileSdkVersion = 34\n    minSdkVersion = 21\n    targetSdkVersion = 34\n    ndkVersion = \"25.1.8937393\"\n}\n\n"
              if "compileSdkVersion = 34" not in txt:
                  txt = ext_block + txt
              txt = re.sub(r"com\.android\.tools\.build:gradle:[0-9.+]+", "com.android.tools.build:gradle:8.3.2", txt)
              txt = re.sub(r"org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9.+]+", "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24", txt)
              root_gradle.write_text(txt, encoding="utf-8")

          for sfile in glob.glob("android/settings.gradle*"):
              sp = Path(sfile)
              stxt = sp.read_text(encoding="utf-8")
              stxt = re.sub(r"id\s+[\"\x27]com\.android\.application[\"\x27]\s+version\s+[\"\x27][0-9.+]+[\"\x27]", "id \"com.android.application\" version \"8.3.2\" apply false", stxt)
              stxt = re.sub(r"id\s+[\"\x27]org\.jetbrains\.kotlin\.android[\"\x27]\s+version\s+[\"\x27][0-9.+]+[\"\x27]", "id \"org.jetbrains.kotlin.android\" version \"1.9.24\" apply false", stxt)
              sp.write_text(stxt, encoding="utf-8")

          for path_str in glob.glob("android/**/build.gradle*", recursive=True):
              p = Path(path_str)
              txt = p.read_text(encoding="utf-8")
              txt = txt.replace("flutter.compileSdkVersion", "34")
              txt = txt.replace("flutter.minSdkVersion", "21")
              txt = txt.replace("flutter.targetSdkVersion", "34")
              txt = txt.replace("flutter.ndkVersion", "\"25.1.8937393\"")
              if p.name == "build.gradle" and "android/app/build.gradle" in str(p).replace("\\", "/"):
                  if "ndkVersion" not in txt:
                      txt = re.sub(r"(android\s*\{)", r"\1\n    ndkVersion \"25.1.8937393\"", txt, count=1)
              p.write_text(txt, encoding="utf-8")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              mtxt = manifest.read_text(encoding="utf-8")
              deep_link = (
                  "        <intent-filter>\n"
                  "          <action android:name=\"android.intent.action.VIEW\" />\n"
                  "          <category android:name=\"android.intent.category.DEFAULT\" />\n"
                  "          <category android:name=\"android.intent.category.BROWSABLE\" />\n"
                  "          <data android:scheme=\"io.supabase.strengtharena\" android:host=\"login-callback\" />\n"
                  "        </intent-filter>\n"
              )
              if "io.supabase.strengtharena" not in mtxt and "</activity>" in mtxt:
                  mtxt = mtxt.replace("</activity>", deep_link + "      </activity>", 1)
                  manifest.write_text(mtxt, encoding="utf-8")
                  print("Injected Supabase deep link into AndroidManifest.xml")
          '
          flutter pub get
          python3 -c '
          from pathlib import Path
          import glob

          for p_str in glob.glob("/home/runner/.pub-cache/hosted/pub.dev/app_links-*/android/build.gradle"):
              p = Path(p_str)
              txt = p.read_text(encoding="utf-8")
              txt = txt.replace("flutter.compileSdkVersion", "34")
              txt = txt.replace("flutter.minSdkVersion", "21")
              txt = txt.replace("flutter.targetSdkVersion", "34")
              p.write_text(txt, encoding="utf-8")
              print("Patched:", p)
          '
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: strength-arena-apk
          path: build/app/outputs/flutter-apk/app-release.apk
